<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>404</title>
<style>
:root {
  --bg: #050608;
  --mx: 50%;
  --my: 50%;
  --grad: linear-gradient(115deg,
    rgba(255, 255, 255, .22) 0%,
    rgba(255, 255, 255, .22) 26%,
    rgba(255, 255, 255, .55) 36%,
    rgba(255, 255, 255, .95) 44%,
    #ffffff 50%,
    rgba(255, 255, 255, .95) 56%,
    rgba(255, 255, 255, .55) 64%,
    rgba(255, 255, 255, .22) 74%,
    rgba(255, 255, 255, .22) 100%);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  transform: translateY(-6vh);
  text-align: center;
}

.code {
  font-size: clamp(100px, 30vw, 190px);
  font-weight: 800;
  line-height: .9;
  letter-spacing: .04em;
  background-image: var(--grad);
  background-size: 250% 250%;
  background-position: var(--mx) var(--my);
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  margin-top: 22px;
  font-size: 14px;
  letter-spacing: .14em;
  text-indent: .14em;
  background-image: var(--grad);
  background-size: 250% 250%;
  background-position: var(--mx) var(--my);
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}

.actions {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.btn {
  appearance: none;
  -webkit-appearance: none;
  width: min(220px, 64vw);
  padding: 13px 0;
  border: 1.5px solid transparent;
  border-radius: 10px;
  background-image: linear-gradient(var(--bg), var(--bg)), var(--grad);
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  background-size: 100% 100%, 250% 250%;
  background-position: 0 0, var(--mx) var(--my);
  background-repeat: no-repeat;
  color: transparent;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: .16em;
  text-indent: .16em;
  cursor: pointer;
  outline: none;
  transition: background-color .08s ease, transform .08s ease;
}

.btn span {
  display: inline-block;
  background-image: var(--grad);
  background-size: 250% 250%;
  background-position: var(--mx) var(--my);
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  text-indent: 0;
  pointer-events: none;
}

.btn:active {
  transform: scale(.97);
}

.btn.hit {
  background-image: none;
  background-color: #fff;
  border-color: #fff;
}

.btn.hit span {
  background-image: none;
  color: var(--bg);
  -webkit-text-fill-color: var(--bg);
}

@media (max-height: 580px) {
  .content { transform: translateY(-2vh) scale(.9); }
  .actions { margin-top: 24px; }
}
</style>
</head>
<body>

<main class="content">
  <div class="code">404</div>
  <p class="subtitle">该页面不存在</p>
  <div class="actions">
    <button class="btn" type="button"><span>搜索</span></button>
    <button class="btn" type="button"><span>主页</span></button>
    <button class="btn" type="button"><span>发现</span></button>
  </div>
</main>

<script>
(function () {
  'use strict';

  document.addEventListener('copy', function (e) { e.preventDefault(); });
  document.addEventListener('cut', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

  var root = document.documentElement;
  var targetX = 0.5, targetY = 0.5;
  var curX = 0.5, curY = 0.5;

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  window.addEventListener('mousemove', function (e) {
    targetX = clamp(e.clientX / window.innerWidth, 0, 1);
    targetY = clamp(e.clientY / window.innerHeight, 0, 1);
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches.length) return;
    var t = e.touches[0];
    targetX = clamp(t.clientX / window.innerWidth, 0, 1);
    targetY = clamp(t.clientY / window.innerHeight, 0, 1);
  }, { passive: true });

  function onOrientation(e) {
    if (e.gamma == null && e.beta == null) return;
    var gamma = e.gamma || 0;
    var beta = e.beta || 0;
    targetX = clamp(0.5 + gamma / 45, 0.02, 0.98);
    targetY = clamp(0.5 + (beta - 50) / 55, 0.02, 0.98);
  }

  var motionAttached = false;

  function attachOrientation() {
    if (motionAttached) return;
    motionAttached = true;
    window.addEventListener('deviceorientation', onOrientation, true);
  }

  function requestMotion() {
    if (motionAttached) return;
    if (typeof DeviceOrientationEvent === 'undefined') return;

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        DeviceOrientationEvent.requestPermission()
          .then(function (state) {
            if (state === 'granted') attachOrientation();
          })
          .catch(function () {});
      } catch (err) {
        /* 非用户手势时调用会抛错，忽略 */
      }
    } else {
      attachOrientation();
    }
  }

  /* 加载即尝试（Android / 已授权设备会立即生效） */
  requestMotion();

  /* 用户任何一次交互都会静默触发授权（iOS 需要手势） */
  ['pointerdown', 'touchstart', 'mousedown', 'click', 'keydown'].forEach(function (evt) {
    window.addEventListener(evt, requestMotion, { passive: true, capture: true });
  });

  function render() {
    curX += (targetX - curX) * 0.09;
    curY += (targetY - curY) * 0.09;
    if (Math.abs(targetX - curX) < 0.0004) curX = targetX;
    if (Math.abs(targetY - curY) < 0.0004) curY = targetY;

    root.style.setProperty('--mx', (curX * 100).toFixed(2) + '%');
    root.style.setProperty('--my', (curY * 100).toFixed(2) + '%');

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  document.querySelectorAll('.btn').forEach(function (btn) {
    function press(e) {
      if (e && e.cancelable) e.preventDefault();
      btn.classList.add('hit');
    }
    function release() {
      btn.classList.remove('hit');
    }

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);

    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10161d">
<title>404</title>
<style>
:root {
  --bg: #10161d;
  --mx: 50%;
  --my: 50%;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  position: fixed;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  background: var(--bg);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

.holo {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.holo__grain {
  position: absolute;
  inset: -20%;
  background: repeating-linear-gradient(
    115deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(255, 255, 255, .04) 5%,
    rgba(255, 255, 255, .09) 7.5%,
    rgba(255, 255, 255, .04) 10%,
    rgba(255, 255, 255, 0) 15%
  );
  background-size: 220% 220%;
  background-position: calc(100% - var(--mx)) var(--my);
  filter: blur(18px);
  opacity: .9;
}

.holo__shine {
  position: absolute;
  inset: -10%;
  background: linear-gradient(
    115deg,
    transparent 0%,
    transparent 40%,
    rgba(255, 255, 255, .05) 44%,
    rgba(255, 255, 255, .16) 47.5%,
    rgba(255, 255, 255, .24) 50%,
    rgba(255, 255, 255, .16) 52.5%,
    rgba(255, 255, 255, .05) 56%,
    transparent 60%,
    transparent 100%
  );
  background-size: 200% 200%;
  background-position: calc(100% - var(--mx)) var(--my);
  filter: blur(2px);
  animation: holoPulse 5s ease-in-out infinite;
}

.holo__glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle at var(--mx) var(--my),
    rgba(255, 255, 255, .07) 0%,
    rgba(255, 255, 255, .03) 22%,
    transparent 46%
  );
}

@keyframes holoPulse {
  0%, 100% { opacity: .75; }
  50%      { opacity: 1; }
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  transform: translateY(-6vh);
  text-align: center;
}

.code {
  font-size: clamp(100px, 30vw, 190px);
  font-weight: 800;
  line-height: .9;
  letter-spacing: .04em;
  color: #fff;
  text-shadow: 0 10px 50px rgba(255, 255, 255, .12);
}

.subtitle {
  margin-top: 22px;
  font-size: 14px;
  letter-spacing: .14em;
  text-indent: .14em;
  color: rgba(255, 255, 255, .9);
}

.actions {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.btn {
  appearance: none;
  -webkit-appearance: none;
  width: min(220px, 64vw);
  padding: 13px 0;
  background: transparent;
  border: 1.5px solid rgba(255, 255, 255, .72);
  border-radius: 10px;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: .16em;
  text-indent: .16em;
  cursor: pointer;
  outline: none;
  transition: color .1s ease, border-color .1s ease, background-color .1s ease, transform .1s ease;
}

.btn:hover {
  border-color: rgba(255, 255, 255, .95);
}

.btn:active {
  transform: scale(.97);
}

.btn.hit {
  background: #fff;
  border-color: #fff;
  color: #10161d;
}

@media (max-height: 580px) {
  .content { transform: translateY(-2vh) scale(.9); }
  .actions { margin-top: 24px; }
}
</style>
</head>
<body>

<div class="holo" aria-hidden="true">
  <div class="holo__grain"></div>
  <div class="holo__shine"></div>
  <div class="holo__glow"></div>
</div>

<main class="content">
  <div class="code">404</div>
  <p class="subtitle">该页面不存在</p>
  <div class="actions">
    <button class="btn" type="button">搜索</button>
    <button class="btn" type="button">主页</button>
    <button class="btn" type="button">发现</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  document.addEventListener('copy', function (e) { e.preventDefault(); });
  document.addEventListener('cut', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('selectstart', function (e) { e.preventDefault(); });
  document.addEventListener('dragstart', function (e) { e.preventDefault(); });

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });

  var root = document.documentElement;
  var targetX = 0.5, targetY = 0.5;
  var curX = 0.5, curY = 0.5;

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  window.addEventListener('mousemove', function (e) {
    targetX = clamp(e.clientX / window.innerWidth, 0, 1);
    targetY = clamp(e.clientY / window.innerHeight, 0, 1);
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (!e.touches || !e.touches.length) return;
    var t = e.touches[0];
    targetX = clamp(t.clientX / window.innerWidth, 0, 1);
    targetY = clamp(t.clientY / window.innerHeight, 0, 1);
  }, { passive: true });

  function onOrientation(e) {
    if (e.gamma == null && e.beta == null) return;
    var gamma = e.gamma || 0;
    var beta = e.beta || 0;
    targetX = clamp(0.5 + gamma / 55, 0.05, 0.95);
    targetY = clamp(0.5 + (beta - 50) / 70, 0.05, 0.95);
  }

  function enableMotion() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission()
        .then(function (state) {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', onOrientation, true);
          }
        })
        .catch(function () {});
    }
  }

  if (typeof DeviceOrientationEvent !== 'undefined') {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      window.addEventListener('click', enableMotion, { once: true });
      window.addEventListener('touchend', enableMotion, { once: true });
    } else {
      window.addEventListener('deviceorientation', onOrientation, true);
    }
  }

  function render() {
    curX += (targetX - curX) * 0.08;
    curY += (targetY - curY) * 0.08;
    if (Math.abs(targetX - curX) < 0.0005) curX = targetX;
    if (Math.abs(targetY - curY) < 0.0005) curY = targetY;

    root.style.setProperty('--mx', (curX * 100).toFixed(2) + '%');
    root.style.setProperty('--my', (curY * 100).toFixed(2) + '%');

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  document.querySelectorAll('.btn').forEach(function (btn) {
    function press(e) {
      if (e && e.cancelable) e.preventDefault();
      btn.classList.add('hit');
    }
    function release() {
      btn.classList.remove('hit');
    }

    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);

    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);

    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
  });
})();
</script>
</body>
</html>

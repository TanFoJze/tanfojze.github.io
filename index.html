<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TanFoJze</title>
<link rel="icon" type="image/png" href="raw/icon000.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background-color: #182231; }
.bg { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<img id="bg" class="bg" src="" alt="">
<script>
function isMobile() {
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}
function isPortrait() {
  return window.innerHeight > window.innerWidth;
}
function setBackground() {
  var bg = document.getElementById('bg');
  if (isMobile() && isPortrait()) {
    bg.src = 'raw/background000.png';
  } else {
    bg.src = 'raw/background002.png';
  }
}
function enterFullscreen() {
  var el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}
setBackground();
window.addEventListener('resize', setBackground);
window.addEventListener('orientationchange', setBackground);
document.addEventListener('click', enterFullscreen);
document.addEventListener('touchstart', enterFullscreen);
</script>
</body>
</html>

                  particles = [];
                  startWeather();

                  applyTheme(wasNight ? data.theme : (data.themeLight || data.theme));
                  isNight = wasNight;
                  document.documentElement.classList.remove('red-theme');
                  document.documentElement.classList.remove('flag-mode');
                  if (hadGlass) {
                    document.documentElement.classList.add('glass');
                    if (btnGlass) btnGlass.classList.add('on');
                  }
                  syncIframeState();
                  if (wasPlaying && bgmEl) {
                    const pb = bgmEl.play();
                    if (pb && pb.catch) pb.catch(() => {});
                    setIcon(btnMusic, 'musicOn');
                  }
                  bioSwap(null);
                  const nameEl2 = document.getElementById('display-name');
                  const handleEl2 = document.getElementById('user-handle');
                  const birthEl2 = document.getElementById('meta-birth');
                  const linkEl2 = document.getElementById('meta-link');
                  if (nameEl2) nameEl2.textContent = data.display_name || '';
                  if (handleEl2) handleEl2.textContent = data.handle || '';
                  if (birthEl2) birthEl2.textContent = data.birth_info || '';
                  if (linkEl2) {
                    linkEl2.href = data.link_url || '#';
                    linkEl2.textContent = data.link_text || data.link_url || '';
                  }
                  const ov = document.getElementById('flag-overlay');
                  if (ov) {
                    ov.classList.remove('on');
                    ov.style.opacity = '0';
                    ov.style.transform = 'scale(1.05)';
                  }
                  if (sectionEl) sectionEl.classList.remove('flag-open');
                  const w3 = document.querySelector('.profile-banner-wrap');
                  if (w3) w3.style.height = baseHeight + 'px';
                }, 3000);
              }

              showToast(pickText('flag_toast', '中华人民共和国万岁 世界人民大团结万岁'), 3000, true);
            });
          }

          const bioWrap = document.getElementById('user-bio-wrap');
          const bioEl = document.getElementById('profile-bio');
          const bioMore = document.getElementById('profile-bio-more');
          const bioToggle = document.getElementById('bio-toggle');
          const BIO_LIMIT = pickNum('bio_limit', 15);
          const fullBio = data.bio || '';
          const moreBio = data.bio_more || '';
          let bioExpanded = false;

          const renderBio = () => {
            if (bioExpanded) {
              bioEl.textContent = fullBio;
              bioMore.textContent = moreBio;
              bioMore.classList.toggle('show', !!moreBio);
            } else {
              bioEl.textContent = fullBio.length > BIO_LIMIT ? fullBio.slice(0, BIO_LIMIT) + '…' : fullBio;
              bioMore.textContent = '';
              bioMore.classList.remove('show');
            }
            bioWrap.classList.toggle('bio-expanded', bioExpanded);
            bioToggle.setAttribute('aria-expanded', bioExpanded ? 'true' : 'false');
            bioToggle.setAttribute('aria-label', bioExpanded ? '收起简介' : '展开简介');
          };

          const CORE_VALUES = pickText('flag_values', '富强 民主 文明 和谐 自由 平等 公正 法治 爱国 敬业 诚信 友善');

          const bioSwap = (text) => {
            if (!bioEl) return;
            if (text === null) {
              renderBio();
          if (store.get('bgm-bio') === '1') { bioExpanded = true; renderBio(); }
              bioMore.classList.remove('show');
            } else {
              bioEl.textContent = text;
              bioMore.textContent = '';
              bioMore.classList.remove('show');
            }
          };

          bioToggle.addEventListener('click', () => {
            bioExpanded = !bioExpanded;
            renderBio();
            store.set('bgm-bio', bioExpanded ? '1' : '0');
          });

          renderBio();
          if (store.get('bgm-bio') === '1') { bioExpanded = true; renderBio(); }
          if (store.get('bgm-bio') === '1') { bioExpanded = true; renderBio(); }

          const linkHref = safeUrl(data.link_url);
          if (linkHref) {
            const linkContainer = document.getElementById('meta-link-container');
            const linkEl = document.getElementById('meta-link');
            linkEl.href = linkHref;
            linkEl.textContent = data.link_text || data.link_url;
            linkEl.rel = 'noopener noreferrer';
            linkContainer.style.display = 'flex';
          }

          if (data.birth_info) {
            const birthContainer = document.getElementById('meta-birth-container');
            document.getElementById('meta-birth').textContent = data.birth_info;
            birthContainer.style.display = 'flex';
          }

          if (data.join_date) {
            const joinContainer = document.getElementById('meta-join-container');
            document.getElementById('meta-join').textContent = data.join_date;
            joinContainer.style.display = 'flex';
          }

          SVG_DATA = svg || {};
          applySvg();
          renderSocials(data.socials);
          if (store.get('bgm-socials') === '1') {
            socialBox.classList.add('expanded');
            socialToggle.setAttribute('aria-expanded', 'true');
            socialToggle.setAttribute('aria-label', '收起更多');
          }

          /* ---------- 背景音乐：仿 Audio Test —— 多源逐个尝试 + 打开即自动播放 ---------- */
          const bgmNode = document.getElementById('bgm');

          /* 自定义音乐网址（弹窗里确认后生效）：有值就只播它；清空则恢复原来的音乐 */
          let bgmCustomUrl = (() => {
            let v = '';
            try { v = localStorage.getItem('bgm-music-url') || ''; } catch (e) {  }
            v = String(v).trim();
            return /^(https?:\/\/|\.\/)/i.test(v) ? v : '';
          })();

          /* 加速源顺序 = 尝试顺序；有自定义网址时它独占列表。
             profile.json 的 bgm_channels 优先，末尾自动把 bgm_url 原站当兜底；
             上次播成功的源会记到 localStorage，下次直接排到最前。 */
          const buildBgmChannels = () => {
            if (bgmCustomUrl) return [bgmCustomUrl];
            const list = Array.isArray(data.bgm_channels)
              ? data.bgm_channels.filter((u) => typeof u === 'string' && /^https?:\/\//i.test(u.trim())).map((u) => u.trim())
              : [];
            const direct = String(data.bgm_url || '').trim();
            if (direct && list.indexOf(direct) === -1) list.push(direct);
            try {
              const saved = localStorage.getItem('bgm-channel');
              const k = saved ? list.indexOf(saved) : -1;
              if (k > 0) { list.splice(k, 1); list.unshift(saved); }
            } catch (e) {  }
            return list;
          };
          let bgmChannelList = buildBgmChannels();

          const BGM_START_TIMEOUT = 15000;  /* 一个源 15 秒完全没数据才算死；CDN 首字节慢不代表坏 */
          const BGM_STALL_TIMEOUT = 12000;  /* 播放中卡 12 秒换下一个，并从原进度续播 */

          let bgmIdx = 0;
          let bgmStarted = false;
          let bgmTimer = 0;
          let bgmStallTimer = 0;
          let bgmToastAt = 0;

          const bgmToast = (text, ms) => {
            const now = Date.now();
            if (now - bgmToastAt < 1200) return;
            bgmToastAt = now;
            showToast(text, ms || 2600);
          };

          const bgmClearTimers = () => {
            if (bgmTimer) { clearTimeout(bgmTimer); bgmTimer = 0; }
            if (bgmStallTimer) { clearTimeout(bgmStallTimer); bgmStallTimer = 0; }
          };

          const bgmAttemptPlay = () => {
            if (!bgmNode || !bgmNode.src) return;
            const p = bgmNode.play();
            /* 自动播放被拦会走 NotAllowedError：不换源，数据继续加载，等下一次手势补播放；
               图标此时应停在「可播放」（musicOff）状态。其它错误由 error 事件统一换源。 */
            if (p && typeof p.catch === 'function') p.catch((err) => {
              if (err && err.name === 'NotAllowedError' && !bgmStarted) setIcon(btnMusic, 'musicOff');
            });
          };

          const bgmTryNext = (resumeAt) => {
            if (!bgmNode) return;
            if (bgmIdx >= bgmChannelList.length) {
              bgmClearTimers();
              setIcon(btnMusic, 'musicOff');
              bgmToast('音乐加载失败：所有加速源都不可用', 4000);
              return;
            }
            bgmNode.src = bgmChannelList[bgmIdx];
            bgmIdx += 1;
            bgmClearTimers();
            if (resumeAt) {
              bgmNode.addEventListener('loadedmetadata', () => {
                try { bgmNode.currentTime = resumeAt; } catch (e) {  }
              }, { once: true });
            }
            try { bgmNode.load(); } catch (e) {  }

            /* 一个源 6 秒没任何数据就换下一个（数据慢但已经来了就不换） */
            bgmTimer = setTimeout(() => {
              bgmTimer = 0;
              if (bgmStarted || bgmNode.readyState >= 2) return;
              bgmToast('加速源 ' + bgmIdx + ' 没响应，换下一个', 1600);
              bgmTryNext(0);
            }, BGM_START_TIMEOUT);

            bgmAttemptPlay();
          };

          if (bgmNode && bgmChannelList.length) {
            bgmNode.loop = true;
            bgmNode.volume = typeof data.bgm_volume === 'number' ? Math.min(1, Math.max(0, data.bgm_volume)) : 0.6;

            bgmNode.addEventListener('playing', () => {
              bgmStarted = true;
              bgmClearTimers();
              setIcon(btnMusic, 'musicOn');
              btnMusic.setAttribute('aria-label', '暂停音乐');
              try { localStorage.setItem('bgm-channel', bgmNode.src); } catch (e) {  }
              ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((ev) => {
                document.removeEventListener(ev, unlockBgm);
              });
            });

            bgmNode.addEventListener('pause', () => {
              if (!bgmNode.ended) {
                setIcon(btnMusic, 'musicOff');
                btnMusic.setAttribute('aria-label', '播放音乐');
              }
            });

            bgmNode.addEventListener('error', () => {
              if (bgmStarted) return;
              bgmToast('加速源 ' + bgmIdx + ' 出错，换下一个', 1400);
              bgmTryNext(0);
            });

            /* 播放中卡住（网速不够）也自动换源，并从当前进度续上 */
            bgmNode.addEventListener('waiting', () => {
              if (!bgmStarted || bgmStallTimer) return;
              bgmStallTimer = setTimeout(() => {
                bgmStallTimer = 0;
                const at = bgmNode.currentTime || 0;
                if (bgmIdx < bgmChannelList.length) {
                  bgmStarted = false;
                  bgmToast('播放卡顿，切换加速源续播', 1800);
                  bgmTryNext(at);
                }
              }, BGM_STALL_TIMEOUT);
            });
            bgmNode.addEventListener('timeupdate', () => {
              if (bgmStallTimer) { clearTimeout(bgmStallTimer); bgmStallTimer = 0; }
            });

            /* 自动播放被拦时，任何一次手势都补一次播放 */
            const unlockBgm = () => { if (!bgmStarted) bgmAttemptPlay(); };
            ['pointerdown', 'touchstart', 'click', 'keydown'].forEach((ev) => {
              document.addEventListener(ev, unlockBgm, { passive: true });
            });

            /* 初始先显示「可播放」图标：自动播放成功会被 playing 事件翻成「播放中」 */
            setTimeout(() => setIcon(btnMusic, 'musicOff'), 0);
            bgmTryNext(0);   /* 打开页面立即开始尝试自动播放 */
          }
          /* ---------- 工具栏按钮 ---------- */
          const setIcon = (el, key) => {
            if (!el) return;
            const svg = el.querySelector('svg');
            const d = SVG_DATA.ui && SVG_DATA.ui[key];
            if (svg && d) svg.innerHTML = '<path d="' + d + '"/>';
          };

          const bgmEl = document.getElementById('bgm');
          const btnMusic = document.getElementById('btn-music');
          const btnReplay = document.getElementById('btn-replay');
          const btnWeather = document.getElementById('btn-weather');
          const btnTheme = document.getElementById('btn-theme');
          const btnGlass = document.getElementById('btn-glass');

          /* 音乐按钮：能播就显示「播放中」图标；自动播放被拦时显示「可播放」图标，
             点一下补播放；播放中再点就暂停。全部源失败过的话，再点会从头重试一遍。 */
          btnMusic.addEventListener('click', () => {
            if (!bgmEl) return;
            if (!bgmEl.paused) {
              bgmEl.pause();
              setIcon(btnMusic, 'musicOff');
              showToast('音乐已暂停', 1400);
              return;
            }
            if (bgmIdx >= bgmChannelList.length) {
              bgmIdx = 0;
              bgmTryNext(0);
            }
            const p = bgmEl.play();
            if (p && typeof p.then === 'function') {
              p.then(() => setIcon(btnMusic, 'musicOn')).catch(() => {});
            }
          });

          btnReplay.addEventListener('click', () => {
            if (!bgmEl) return;
            if (bgmIdx >= bgmChannelList.length) bgmIdx = 0;
            try { bgmEl.currentTime = 0; } catch (e) {}
            const p = bgmEl.play();
            if (p && typeof p.then === 'function') {
              p.then(() => setIcon(btnMusic, 'musicOn')).catch(() => {});
            }
          });

          /* ---------- 音乐网址弹窗 ---------- */
          const modalOverlay = document.getElementById('modal-overlay');
          const modalInput = document.getElementById('modal-input');
          const btnMusicUrl = document.getElementById('btn-music-url');

          const closeMusicUrlModal = () => { if (modalOverlay) modalOverlay.hidden = true; };

          const applyCustomMusic = () => {
            bgmIdx = 0;
            bgmStarted = false;
            bgmClearTimers();
            bgmChannelList = buildBgmChannels();
            bgmTryNext(0);
          };

          btnMusicUrl.addEventListener('click', () => {
            if (!modalOverlay || !modalInput) return;
            modalInput.value = bgmCustomUrl;
            modalOverlay.hidden = false;
            setTimeout(() => { try { modalInput.focus(); } catch (e) {  } }, 30);
          });

          document.getElementById('modal-cancel').addEventListener('click', closeMusicUrlModal);

          document.getElementById('modal-confirm').addEventListener('click', () => {
            const v = modalInput ? modalInput.value.trim() : '';
            if (v === bgmCustomUrl) { closeMusicUrlModal(); return; }
            if (!v) {
              store.set('bgm-music-url', '');
              bgmCustomUrl = '';
              showToast('已恢复原来的音乐', 1800);
            } else if (!/^(https?:\/\/|\.\/)/i.test(v)) {
              showToast('网址格式不对：要以 http(s):// 或 ./ 开头', 2800);
              return;
            } else {
              store.set('bgm-music-url', v);
              bgmCustomUrl = v;
              showToast('已切换音乐', 1800);
            }
            applyCustomMusic();
            closeMusicUrlModal();
          });

          modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeMusicUrlModal();
          });

          document.addEventListener('keydown', (e) => {
            if (!modalOverlay || modalOverlay.hidden) return;
            if (e.key === 'Escape') closeMusicUrlModal();
            else if (e.key === 'Enter') document.getElementById('modal-confirm').click();
          });

          /* ---------- 天气粒子 ---------- */
          const WEATHER_SEQ = ['rain', 'snow', 'none', 'bgRain', 'bgSnow'];
          let weatherMode = WEATHER_SEQ.indexOf(String(data.weather_default || '')) >= 0 ? String(data.weather_default) : 'bgRain';
          let weatherIndex = Math.max(0, WEATHER_SEQ.indexOf(weatherMode));
          let particles = [];
          let rafId = null;

          const isDay = () => document.documentElement.classList.contains('day');
          const isFull = () => weatherMode === 'rain' || weatherMode === 'snow';
          const kindOf = () => (weatherMode === 'rain' || weatherMode === 'bgRain') ? 'rain'
            : (weatherMode === 'snow' || weatherMode === 'bgSnow') ? 'snow' : 'none';

          const activeCanvas = () => (isFull() ? canvasMain : canvasBg);
          const activeCtx = () => (isFull() ? ctxMain : ctxBg);

          const setupCanvas = (c, ctx) => {
            if (!c || !ctx) return { W: 0, H: 0 };
            syncCanvasSize(c, ctx);
            const rect = c.getBoundingClientRect();
            return { W: Math.max(1, Math.round(rect.width)), H: Math.max(1, Math.round(rect.height)) };
          };

          const buildParticles = (W, H) => {
            particles = [];
            const kind = kindOf();
            if (kind === 'rain') {
              const n = Math.min(220, Math.round(W / 2.2));
              for (let i = 0; i < n; i++) {
                particles.push({
                  x: Math.random() * W, y: Math.random() * H,
                  len: 8 + Math.random() * 14, spd: 6 + Math.random() * 7,
                  a: 0.14 + Math.random() * 0.32
                });
              }
            } else if (kind === 'snow') {
              const n = Math.min(150, Math.round(W / 4.5));
              for (let i = 0; i < n; i++) {
                particles.push({
                  x: Math.random() * W, y: Math.random() * H,
                  r: 0.7 + Math.random() * 1.7, spd: 0.35 + Math.random() * 0.85,
                  drift: 0.3 + Math.random() * 0.7, phase: Math.random() * 6.28,
                  a: 0.35 + Math.random() * 0.5
                });
              }
            }
          };

          /* 雨滴按透明度分桶批量描边：每帧 stroke 次数从「粒子数」降到 8 次，
             同时避免每颗粒子每帧拼一次 rgba() 字符串（GC 抖动的主要来源）。 */
          const RAIN_BUCKETS = 8;
          const RAIN_ALPHA_STEP = 0.05;
          const rainPaths = new Array(RAIN_BUCKETS);
          const rainUsed = new Array(RAIN_BUCKETS);

          const drawWeather = () => {
            const c = activeCanvas();
            const ctx = activeCtx();
            if (!c || !ctx) { rafId = null; return; }
            const dprNow = Math.min(window.devicePixelRatio || 1, 2);
            const W = c.width / dprNow;
            const H = c.height / dprNow;
            ctx.clearRect(0, 0, W, H);
            const kind = kindOf();
            const day = isDay();
            const col = kind === 'rain'
              ? (day ? '92,112,104' : '176,198,190')
              : (day ? '150,165,180' : '235,242,248');

            if (kind === 'rain') {
              for (let b = 0; b < RAIN_BUCKETS; b++) {
                rainPaths[b] = new Path2D();
                rainUsed[b] = false;
              }
              for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                let b = Math.round(p.a / RAIN_ALPHA_STEP) - 1;
                if (b < 0) b = 0;
                else if (b > RAIN_BUCKETS - 1) b = RAIN_BUCKETS - 1;
                const path = rainPaths[b];
                path.moveTo(p.x, p.y);
                path.lineTo(p.x - 1.4, p.y + p.len);
                rainUsed[b] = true;
                p.y += p.spd;
                p.x -= 0.4;
                if (p.y > H) { p.y = -p.len; p.x = Math.random() * W; }
              }
              ctx.lineWidth = 1;
              for (let b = 0; b < RAIN_BUCKETS; b++) {
                if (!rainUsed[b]) continue;
                ctx.strokeStyle = 'rgba(' + col + ',' + ((b + 1) * RAIN_ALPHA_STEP).toFixed(2) + ')';
                ctx.stroke(rainPaths[b]);
              }
            } else {
              for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = 'rgba(' + col + ',' + p.a + ')';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, 6.2832);
                ctx.fill();
                p.phase += 0.012;
                p.y += p.spd;
                p.x += Math.sin(p.phase) * p.drift;
                if (p.y > H) { p.y = -4; p.x = Math.random() * W; }
                if (p.x > W) p.x = -2;
                if (p.x < -2) p.x = W;
              }
            }
            rafId = requestAnimationFrame(drawWeather);
          };

          const clearAll = () => {
            if (ctxMain && canvasMain) ctxMain.clearRect(0, 0, canvasMain.width, canvasMain.height);
            if (ctxBg && canvasBg) ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
          };

          const startWeather = () => {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            clearAll();
            const root = document.documentElement;
            ['weather-rain', 'weather-snow', 'weather-bg-rain', 'weather-bg-snow'].forEach((c) => {
              root.classList.remove(c);
            });
            if (weatherMode === 'rain') root.classList.add('weather-rain');
            else if (weatherMode === 'snow') root.classList.add('weather-snow');
            else if (weatherMode === 'bgRain') root.classList.add('weather-bg-rain');
            else if (weatherMode === 'bgSnow') root.classList.add('weather-bg-snow');
            if (kindOf() === 'none') return;
            const c = activeCanvas();
            const ctx = activeCtx();
            const size = setupCanvas(c, ctx);
            buildParticles(size.W, size.H);
            rafId = requestAnimationFrame(drawWeather);
          };

          /* 画布尺寸统一由 ResizeObserver 驱动（视口变化 / 旋转 / 下拉拉伸都能兜住）。
             雨雪是「从上往下落」，宽度变了才需要重建粒子；纯高度变化（下拉拉伸横幅）
             只同步画布尺寸，避免拉伸过程中反复重排 200 多个雨滴造成掉帧。 */
          let lastWeatherWidth = 0;
          const handleCanvasResize = () => {
            if (!canvasBg || !ctxBg) return;
            const before = canvasBg.width + 'x' + canvasBg.height + '/' + (canvasMain ? canvasMain.width + 'x' + canvasMain.height : '');
            syncCanvasSize(canvasBg, ctxBg);
            syncCanvasSize(canvasMain, ctxMain);
            const after = canvasBg.width + 'x' + canvasBg.height + '/' + (canvasMain ? canvasMain.width + 'x' + canvasMain.height : '');
            if (before === after) return;
            if (kindOf() === 'none') return;
            const rect = activeCanvas().getBoundingClientRect();
            const w = Math.max(1, Math.round(rect.width));
            if (Math.abs(w - lastWeatherWidth) < 2) return;
            lastWeatherWidth = w;
            buildParticles(w, Math.max(1, Math.round(rect.height)));
          };

          if (window.ResizeObserver) {
            const ro = new ResizeObserver(handleCanvasResize);
            if (canvasBg) ro.observe(canvasBg);
            if (canvasMain) ro.observe(canvasMain);
          } else {
            window.addEventListener('resize', handleCanvasResize);
          }

          const WEATHER_LABEL = {
            rain: '全屏下雨',
            snow: '全屏下雪',
            none: '无天气效果',
            bgRain: '背景图下雨',
            bgSnow: '背景图下雪'
          };

          btnWeather.addEventListener('click', () => {
            weatherIndex = (weatherIndex + 1) % WEATHER_SEQ.length;
            weatherMode = WEATHER_SEQ[weatherIndex];
            setIcon(btnWeather, weatherMode);
            btnWeather.classList.toggle('on', weatherMode !== 'none');
            showToast(WEATHER_LABEL[weatherMode] || '');
            /* 国旗展示期间只记模式，等红旗退场再生效 */
            if (flagLocked) return;
            startWeather();
          });

          let isNight = (data.theme_default || 'night') !== 'day';
          btnTheme.addEventListener('click', () => {
            isNight = !isNight;
            applyTheme(isNight ? data.theme : (data.themeLight || data.theme));
            setIcon(btnTheme, isNight ? 'moon' : 'sun');
            document.documentElement.classList.toggle('day', !isNight);
            store.set('bgm-theme', isNight ? 'night' : 'day');
            syncIframeState();
            showToast(isNight ? '夜晚模式' : '白天模式');
          });

          btnGlass.addEventListener('click', () => {
            const on = document.documentElement.classList.toggle('glass');
            btnGlass.classList.toggle('on', on);
            store.set('bgm-glass', on ? '1' : '0');
            syncIframeState();
            showToast(on ? '玻璃效果已开启' : '玻璃效果已关闭');
          });

          const savedGlass = store.get('bgm-glass');
          if (savedGlass !== null ? savedGlass === '1' : pickBool('glass_default', false)) {
            document.documentElement.classList.add('glass');
            btnGlass.classList.add('on');
          }

          /* 按默认主题把白天/夜晚按钮图标摆正 */
          setIcon(btnTheme, isNight ? 'moon' : 'sun');

          /* ---------- 与标签页 iframe 同步界面状态（主题/玻璃/配色） ---------- */
          const iframeState = () => {
            const cs = getComputedStyle(document.documentElement);
            const val = (name) => (cs.getPropertyValue(name) || '').trim();
            return {
              type: 'profile-state',
              theme: document.documentElement.classList.contains('day') ? 'day' : 'night',
              glass: document.documentElement.classList.contains('glass'),
              flag: document.documentElement.classList.contains('flag-mode'),
              palette: {
                bg: val('--color-bg'),
                text: val('--color-text'),
                textMuted: val('--color-text-muted'),
                border: val('--color-border'),
                accent: val('--color-accent'),
                skeleton: val('--color-skeleton'),
                hover: val('--color-hover-tint')
              }
            };
          };

          const syncIframeState = () => {
            const frame = document.getElementById('feed-frame');
            if (!frame || !frame.contentWindow) return;
            try { frame.contentWindow.postMessage(iframeState(), '*'); } catch (e) {  }
          };

          /* 子页面加载完会发 profile-state-request，这里回包 */
          window.addEventListener('message', (e) => {
            const d = e.data;
            if (d && d.type === 'profile-state-request' && e.source && e.source.postMessage) {
              try { e.source.postMessage(iframeState(), '*'); } catch (err) {  }
            }
          });

          const feedFrameEl = document.getElementById('feed-frame');
          if (feedFrameEl) feedFrameEl.addEventListener('load', syncIframeState);

          syncIframeState();

          /* 页面藏到后台时显式停掉粒子循环，回前台再续（省电） */
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            } else if (kindOf() !== 'none' && !rafId && !flagLocked) {
              rafId = requestAnimationFrame(drawWeather);
            }
          });

          stopWeatherForLeave = () => {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            particles = [];
            clearAll();
            document.documentElement.classList.remove(
              'weather-rain', 'weather-snow', 'weather-bg-rain', 'weather-bg-snow'
            );
          };

          pauseBgmForLeave = () => {
            const b = document.getElementById('bgm');
            if (b && !b.paused) b.pause();
          };

          btnWeather.classList.add('on');
          document.documentElement.style.setProperty('--glass-image', `url('${safeCssUrl(data.background_image_url) || './profilebg.png'}')`);
          startWeather();

          /* ---------- 图片预加载（低清先上、高清后补）---------- */
          const preloadImage = (url) => new Promise((resolve) => {
            if (!url) { resolve(null); return; }
            const im = new Image();
            im.onload = () => resolve(im);
            im.onerror = () => resolve(null);
            im.src = url;
          });

          const loadPictures = async () => {
            const bannerEl = document.getElementById('profile-banner');
            const avatarEl = document.getElementById('profile-avatar');
            const lowBgUrl = safeCssUrl(data.background_low_url);
            const lowAvUrl = safeCssUrl(data.avatar_low_url);
            const hdBgUrl = safeCssUrl(data.background_image_url);
            const hdAvUrl = safeCssUrl(data.avatar_image_url);

            /* 先并行拿两张低清占位，再并行换高清，别一个个串着等 */
            const [lowBg, lowAv] = await Promise.all([
              preloadImage(lowBgUrl),
              preloadImage(lowAvUrl)
            ]);
            if (lowBg && bannerEl) bannerEl.style.backgroundImage = `url('${lowBgUrl}')`;
            if (lowAv && avatarEl) avatarEl.style.backgroundImage = `url('${lowAvUrl}')`;

            const [hdBg, hdAv] = await Promise.all([
              preloadImage(hdBgUrl),
              preloadImage(hdAvUrl)
            ]);

            if (hdBg && bannerEl) {
              const applyBg = () => {
                bannerEl.style.setProperty('--banner-src', `url('${hdBgUrl}')`);
                bannerEl.classList.add('has-remote');
              };
              if (hdBg.decode) hdBg.decode().then(applyBg).catch(applyBg); else applyBg();
            }

            if (hdAv && avatarEl) {
              const applyAv = () => {
                avatarEl.style.setProperty('--avatar-src', `url('${hdAvUrl}')`);
                avatarEl.classList.add('has-remote');
              };
              if (hdAv.decode) hdAv.decode().then(applyAv).catch(applyAv); else applyAv();
            }
          };

          loadPictures();
        })
        .catch(error => {
          console.error('Error loading profile.json:', error);
          document.getElementById('display-name').textContent = '数据加载失败';
        });

      /* ---------- 启动遮罩 + 从 bfcache 返回时的状态恢复 ---------- */
      const playBoot = () => {
        const veil = document.getElementById('boot-veil');
        if (!veil) return;
        veil.style.animation = 'none';
        void veil.offsetWidth;
        veil.style.animation = '';
      };

      const restorePage = () => {
        const root = document.documentElement;
        root.classList.remove('leaving', 'flag-mode', 'red-theme', 'glass');
        const bw = document.querySelector('.profile-banner-wrap');
        if (bw) bw.style.height = '';
        const sec = document.querySelector('.profile-section');
        if (sec) sec.classList.remove('flag-open');
        const overlay = document.getElementById('flag-overlay');
        if (overlay) { overlay.classList.remove('on'); overlay.style.opacity = '0'; }
        const wave = document.getElementById('flag-wave');
        if (wave) wave.classList.remove('on');
        const hint = document.getElementById('pull-hint');
        if (hint) hint.style.opacity = '0';
        const banner = document.getElementById('profile-banner');
        if (banner) {
          banner.style.filter = 'blur(0px)';
          banner.style.setProperty('--pull-scale', '1');
        }
        flagLocked = false;
        leaving = false;
        flagTapCount = 0;
        setWheelLock(false);
        applyOrientationGuard();
      };

      window.addEventListener('pageshow', (e) => {
        if (!e.persisted) return;
        restorePage();
        playBoot();
      });

      playBoot();

      /* ---------- 重力倾斜（仅手机，静下来就停帧）---------- */
      const TILT_MAX_X = 14;
      const TILT_MAX_Y = 14;
      let tiltRawX = 0, tiltRawY = 0;
      let tiltTargetX = 0, tiltTargetY = 0;
      let tiltCurX = 0, tiltCurY = 0;
      let tiltVelX = 0, tiltVelY = 0;
      let tiltRaf = null;
      let tiltOn = false;
      let tiltLastTime = 0;
      let tiltSetX = 0, tiltSetY = 0;
      const tiltBanner = document.getElementById('profile-banner');

      const TILT_STIFF = 0.05;
      const TILT_DAMP = 0.78;

      const easeTilt = (v) => Math.sin(Math.max(-1, Math.min(1, v)) * Math.PI / 2);

      const tiltLoop = (now) => {
        const t = typeof now === 'number' ? now : performance.now();
        const dt = tiltLastTime ? Math.min(48, t - tiltLastTime) : 16.67;
        tiltLastTime = t;
        const step = Math.max(0.25, Math.min(3, dt / 16.67));
        const decay = Math.pow(TILT_DAMP, step);

        const maxStep = 0.045 * step;
        const dxRaw = tiltRawX - tiltTargetX;
        const dyRaw = tiltRawY - tiltTargetY;
        tiltTargetX += Math.max(-maxStep, Math.min(maxStep, dxRaw));
        tiltTargetY += Math.max(-maxStep, Math.min(maxStep, dyRaw));

        tiltVelX = (tiltVelX + (tiltTargetX - tiltCurX) * TILT_STIFF) * decay;
        tiltVelY = (tiltVelY + (tiltTargetY - tiltCurY) * TILT_STIFF) * decay;
        tiltCurX += tiltVelX * step;
        tiltCurY += tiltVelY * step;

        const settledX = Math.abs(tiltVelX) < 0.0004 && Math.abs(tiltTargetX - tiltCurX) < 0.0004;
        const settledY = Math.abs(tiltVelY) < 0.0004 && Math.abs(tiltTargetY - tiltCurY) < 0.0004;
        if (settledX) {
          tiltVelX = 0;
          tiltCurX = tiltTargetX;
        }
        if (settledY) {
          tiltVelY = 0;
          tiltCurY = tiltTargetY;
        }

        const nx = easeTilt(tiltCurX) * TILT_MAX_X;
        const ny = easeTilt(tiltCurY) * TILT_MAX_Y;
        const bannerEl = tiltBanner;   /* 缓存引用，避免每帧查 DOM */
        if (bannerEl) {
          if (Math.abs(nx - tiltSetX) > 0.05) {
            bannerEl.style.setProperty('--tilt-x', nx.toFixed(2) + 'px');
            tiltSetX = nx;
          }
          if (Math.abs(ny - tiltSetY) > 0.05) {
            bannerEl.style.setProperty('--tilt-y', ny.toFixed(2) + 'px');
            tiltSetY = ny;
          }
        }

        /* 完全静下来就停掉这一帧循环，等下一次重力感应数据再启动，避免手机上空转 60fps */
        const idle = settledX && settledY
          && Math.abs(tiltRawX - tiltTargetX) < 0.002
          && Math.abs(tiltRawY - tiltTargetY) < 0.002;
        if (idle) {
          tiltRaf = null;
          tiltLastTime = 0;
          return;
        }
        tiltRaf = requestAnimationFrame(tiltLoop);
      };

      const onOrient = (e) => {
        const gamma = typeof e.gamma === 'number' ? e.gamma : 0;
        const beta = typeof e.beta === 'number' ? e.beta : 90;
        tiltRawX = Math.max(-1, Math.min(1, -gamma / 30));
        tiltRawY = Math.max(-1, Math.min(1, (beta - 90) / 45));
        if (tiltOn && !tiltRaf && !document.hidden) {
          tiltLastTime = 0;
          tiltRaf = requestAnimationFrame(tiltLoop);
        }
      };

      const enableTilt = () => {
        if (tiltOn) return;
        const start = () => {
          if (tiltOn) return;
          tiltOn = true;
          window.addEventListener('deviceorientation', onOrient, true);
          if (!tiltRaf) tiltRaf = requestAnimationFrame(tiltLoop);
        };
        if (typeof DeviceOrientationEvent !== 'undefined'
            && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then((res) => {
            if (res === 'granted') start();
          }).catch(() => {});
        } else {
          start();
        }
      };

      document.addEventListener('touchstart', enableTilt, { once: true, passive: true });
      document.addEventListener('click', enableTilt, { once: true });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (tiltRaf) { cancelAnimationFrame(tiltRaf); tiltRaf = null; }
        } else if (tiltOn && !tiltRaf) {
          tiltRaf = requestAnimationFrame(tiltLoop);
        }
      });

      /* ---------- 鼠标倾斜（桌面）：把陀螺仪效果绑到鼠标位置，幅度与陀螺仪一致 ---------- */
      (() => {
        const finePointer = window.matchMedia
          && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
        const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!finePointer || reduced) return;

        let tgtX = 0, tgtY = 0;
        let curX = 0, curY = 0;
        let raf = null;

        const tick = () => {
          curX += (tgtX - curX) * 0.06;
          curY += (tgtY - curY) * 0.06;
          const idle = Math.abs(tgtX - curX) < 0.001 && Math.abs(tgtY - curY) < 0.001;
          if (idle) { curX = tgtX; curY = tgtY; }
          const el = tiltBanner;
          if (el) {
            el.style.setProperty('--tilt-x', (Math.sin(curX * Math.PI / 2) * TILT_MAX_X).toFixed(2) + 'px');
            el.style.setProperty('--tilt-y', (Math.sin(curY * Math.PI / 2) * TILT_MAX_Y).toFixed(2) + 'px');
          }
          raf = idle ? null : requestAnimationFrame(tick);
        };

        document.addEventListener('mousemove', (e) => {
          const w = window.innerWidth || 1;
          const h = window.innerHeight || 1;
          tgtX = Math.max(-1, Math.min(1, (e.clientX / w) * 2 - 1));
          tgtY = Math.max(-1, Math.min(1, (e.clientY / h) * 2 - 1));
          if (!raf) raf = requestAnimationFrame(tick);
        }, { passive: true });

        window.addEventListener('blur', () => { if (raf) { cancelAnimationFrame(raf); raf = null; } });
      })();

      /* ============ 下拉栅栏：触摸（整页）与鼠标（横幅 + 资料头）共用同一套逻辑 ============ */
      const bannerWrap = document.querySelector('.profile-banner-wrap');
      const banner = document.getElementById('profile-banner');
      const pullHint = document.getElementById('pull-hint');

      const baseHeight = 160;
      const maxHeight = 320;
      const PULL_SPAN = (maxHeight - baseHeight) * 2.2;

      let startY = 0;
      let isPulling = false;
      let pullSource = 'touch';
      let mousePending = null;

      const getScrollTop = () => window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;

      /* 鼠标从哪里按下算「下拉」：横幅 + 资料头；这些区域里的按钮/链接不参与，避免抢点击 */
      const PULL_ZONE_SEL = '.profile-banner-wrap, .profile-section';
      const PULL_BLOCK_SEL = 'button, a, input, textarea, select, label, .toolbar, .tabs, .feed, .social-links, .action-buttons, .btn-outline';
      const MOUSE_PULL_THRESHOLD = 6;

      const canStartPull = () => !flagLocked
        && !document.documentElement.classList.contains('force-portrait')
        && getScrollTop() <= 0;

      const setPullHint = (progress) => {
        if (!pullHint) return;
        pullHint.style.opacity = Math.max(0, Math.min(1, progress)).toFixed(3);
        pullHint.textContent = progress >= 0.97 ? pickText('pull_hint_ready', '松手跳转') : pickText('pull_hint_pull', '拉动跳转');
      };

      function resetBanner() {
        if (pullHint) pullHint.style.opacity = '0';
        bannerWrap.style.height = baseHeight + 'px';
        banner.style.filter = 'blur(0px)';
        banner.style.setProperty('--pull-scale', '1');
      }

      const pullBegin = (y, source) => {
        if (isPulling || !canStartPull()) return false;
        startY = y;
        isPulling = true;
        pullSource = source;
        bannerWrap.style.transition = 'none';
        banner.style.transition = 'none';
        return true;
      };

      const pullMove = (y) => {
        if (!isPulling) return false;
        const deltaY = y - startY;
        if (deltaY <= 0) {
          isPulling = false;
          resetBanner();
          return false;
        }

        const t = Math.min(1, deltaY / PULL_SPAN);
        const pulled = (maxHeight - baseHeight) * (1 - Math.pow(1 - t, 2));
        const newHeight = Math.min(maxHeight, baseHeight + pulled);
        const progress = (newHeight - baseHeight) / (maxHeight - baseHeight);

        setPullHint(progress);
        bannerWrap.style.height = newHeight + 'px';
        banner.style.filter = 'blur(' + (progress * 3.5).toFixed(2) + 'px)';
        banner.style.setProperty('--pull-scale', (1 + progress * 0.08).toFixed(3));
        return true;
      };

      const pullEnd = () => {
        if (!isPulling) return;
        isPulling = false;

        const curH = parseFloat(bannerWrap.style.height) || baseHeight;
        if (curH >= maxHeight - 1) {
          leaveTo();
          return;
        }

        if (pullHint) pullHint.style.opacity = '0';
        bannerWrap.style.transition = 'height 0.3s cubic-bezier(0.25, 0.8, 0.5, 1)';
        banner.style.transition = 'filter 0.3s cubic-bezier(0.25, 0.8, 0.5, 1), transform 0.3s cubic-bezier(0.25, 0.8, 0.5, 1)';
        bannerWrap.style.height = baseHeight + 'px';
        banner.style.filter = 'blur(0px)';
        banner.style.setProperty('--pull-scale', '1');
      };

      const leaveTo = () => {
        if (leaving) return;
        leaving = true;
        if (typeof stopWeatherForLeave === 'function') stopWeatherForLeave();
        if (typeof pauseBgmForLeave === 'function') pauseBgmForLeave();
        document.documentElement.classList.add('leaving');
        setTimeout(() => {
          window.location.href = pickText('pull_jump_url', 'https://tanfojze.github.io/tanfojze/');
        }, 40);
      };

      /* —— 触摸：整页都能起手 —— */
      document.addEventListener('touchstart', (e) => {
        if (!e.touches || !e.touches.length) return;
        pullBegin(e.touches[0].clientY, 'touch');
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (flagLocked) {
          if (e.cancelable) e.preventDefault();
          return;
        }
        if (!isPulling || pullSource !== 'touch' || !e.touches || !e.touches.length) return;
        if (pullMove(e.touches[0].clientY) && e.cancelable) e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchend', () => { if (pullSource === 'touch') pullEnd(); });
      document.addEventListener('touchcancel', () => { if (pullSource === 'touch') pullEnd(); });

      /* —— 鼠标：先下拖 6px 才判定，避免误吃点击与选字 —— */
      const inPullZone = (target) => !!target && !!target.closest
        && !target.closest(PULL_BLOCK_SEL)
        && !!target.closest(PULL_ZONE_SEL);

      document.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || isPulling) return;
        if (!inPullZone(e.target)) return;
        mousePending = { y: e.clientY, x: e.clientX };
      });

      document.addEventListener('mousemove', (e) => {
        if (isPulling && pullSource === 'mouse') {
          if (pullMove(e.clientY) && e.cancelable) e.preventDefault();
          return;
        }
        if (!mousePending) return;
        const dy = e.clientY - mousePending.y;
        if (dy <= MOUSE_PULL_THRESHOLD || dy <= Math.abs(e.clientX - mousePending.x)) return;
        const y0 = mousePending.y;
        mousePending = null;
        if (!pullBegin(y0, 'mouse')) return;
        const sel = window.getSelection && window.getSelection();
        if (sel && sel.removeAllRanges) sel.removeAllRanges();
        if (e.cancelable) e.preventDefault();
        pullMove(e.clientY);
      });

      document.addEventListener('mouseup', () => {
        mousePending = null;
        if (pullSource === 'mouse') pullEnd();
      });

      window.addEventListener('blur', () => {
        mousePending = null;
        if (pullSource === 'mouse') pullEnd();
      });

      bannerWrap.addEventListener('transitionend', () => {
        if (!isPulling) {
          bannerWrap.style.transition = 'none';
          banner.style.transition = 'none';
        }
      });
    });
  </script>
</body>
</html>

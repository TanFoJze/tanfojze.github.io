<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TFJtime</title>
</head>
<body>
    <div id="output"></div>
    <script>
        (function() {
            var output = document.getElementById('output');

            function decrypt(hex) {
                var cleaned = hex.replace(/[\u200B-\u200D\uFEFF]/g, '');
                var result = '';
                for (var i = 0; i < cleaned.length; i += 2) {
                    var byte = parseInt(cleaned.substr(i, 2), 16) - 10;
                    result += String.fromCharCode(byte);
                }
                return result;
            }

            var encId = '\u200B3B3A3A3B433E3E41';
            var encKey = '\u200B6D3D3E403E6C41423D3D6C6F3D416C433B703D3C406F6E706D3C3B3E6B6C6F3F';
            var id = decrypt(encId);
            var key = decrypt(encKey);

            var apiBaseMs = null;
            var apiTimer = null;

            function render(localTimeStr, apiTimeStr) {
                output.textContent = '{"本机时间":"' + localTimeStr + '","当前时间":"' + apiTimeStr + '"}';
            }

            function getLocalTimeStr() {
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                var hours = String(now.getHours()).padStart(2, '0');
                var mins = String(now.getMinutes()).padStart(2, '0');
                var secs = String(now.getSeconds()).padStart(2, '0');
                var ms = String(now.getMilliseconds()).padStart(3, '0');
                return year + '-' + month + '-' + day + ' ' + hours + ':' + mins + ':' + secs + '.' + ms;
            }

            function getApiTimeStr() {
                if (apiBaseMs === null) return 'NULL';
                var d = new Date(apiBaseMs);
                var year = d.getFullYear();
                var month = String(d.getMonth() + 1).padStart(2, '0');
                var day = String(d.getDate()).padStart(2, '0');
                var hours = String(d.getHours()).padStart(2, '0');
                var mins = String(d.getMinutes()).padStart(2, '0');
                var secs = String(d.getSeconds()).padStart(2, '0');
                var ms = String(d.getMilliseconds()).padStart(3, '0');
                return year + '-' + month + '-' + day + ' ' + hours + ':' + mins + ':' + secs + '.' + ms;
            }

            function updateDisplay() {
                var localStr = getLocalTimeStr();
                var apiStr = (apiBaseMs !== null) ? getApiTimeStr() : 'NULL';
                render(localStr, apiStr);
            }

            function startApiTimer() {
                if (apiTimer) clearInterval(apiTimer);
                apiTimer = setInterval(function() {
                    if (apiBaseMs !== null) {
                        apiBaseMs += 20;
                        updateDisplay();
                    }
                }, 20);
            }

            function fetchApiTime() {
                var url = 'https://cn.apihz.cn/api/time/getapi.php?id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key) + '&type=2';
                fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(function(data) {
                    if (data.code === 200 && data.msg) {
                        var parts = data.msg.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                        if (parts) {
                            var apiDate = new Date(
                                parseInt(parts[1], 10),
                                parseInt(parts[2], 10) - 1,
                                parseInt(parts[3], 10),
                                parseInt(parts[4], 10),
                                parseInt(parts[5], 10),
                                parseInt(parts[6], 10),
                                0
                            );
                            apiBaseMs = apiDate.getTime();
                            startApiTimer();
                            updateDisplay();
                        } else {
                            throw new Error();
                        }
                    } else {
                        throw new Error();
                    }
                })
                .catch(function() {
                    updateDisplay();
                });
            }

            fetchApiTime();
            setInterval(updateDisplay, 20);

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    if (apiTimer) clearInterval(apiTimer);
                    apiBaseMs = null;
                    fetchApiTime();
                }
            });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TFJtime</title>
</head>
<body>
    <div id="output"></div>
    <script>
        (function() {
            var output = document.getElementById('output');
            var weatherData = 'NULL';

            function decrypt(hex) {
                var result = '';
                for (var i = 0; i < hex.length; i += 2) {
                    var byte = parseInt(hex.substr(i, 2), 16) - 10;
                    result += String.fromCharCode(byte);
                }
                return result;
            }

            var encId = '3B3A3A3B433E3E41';
            var encKey = '6D3D3E403E6C41423D3D6C6F3D416C433B703D3C406F6E706D3C3B3E6B6C6F3F';
            var id = decrypt(encId);
            var key = decrypt(encKey);

            var apiBaseTime = null;
            var localStartTime = null;

            function render(localTimeStr, apiTimeStr, weatherStr) {
                output.textContent = '{"本机时间":"' + localTimeStr + '","当前时间":"' + apiTimeStr + '","天气":"' + weatherStr + '"}';
            }

            function updateDisplay() {
                var now = new Date();
                var year = now.getFullYear();
                var month = String(now.getMonth() + 1).padStart(2, '0');
                var day = String(now.getDate()).padStart(2, '0');
                var hours = String(now.getHours()).padStart(2, '0');
                var mins = String(now.getMinutes()).padStart(2, '0');
                var secs = String(now.getSeconds()).padStart(2, '0');
                var ms = String(now.getMilliseconds()).padStart(3, '0');
                var localStr = year + '-' + month + '-' + day + ' ' + hours + ':' + mins + ':' + secs + '.' + ms;

                var apiStr = 'NULL';
                if (apiBaseTime && localStartTime !== null) {
                    var elapsed = now.getTime() - localStartTime;
                    var apiNow = new Date(apiBaseTime.getTime() + elapsed);
                    var y = apiNow.getFullYear();
                    var mo = String(apiNow.getMonth() + 1).padStart(2, '0');
                    var d = String(apiNow.getDate()).padStart(2, '0');
                    var h = String(apiNow.getHours()).padStart(2, '0');
                    var m = String(apiNow.getMinutes()).padStart(2, '0');
                    var s = String(apiNow.getSeconds()).padStart(2, '0');
                    var mil = String(apiNow.getMilliseconds()).padStart(3, '0');
                    apiStr = y + '-' + mo + '-' + d + ' ' + h + ':' + m + ':' + s + '.' + mil;
                }

                render(localStr, apiStr, weatherData);
            }

            function fetchApiTime() {
                var url = 'https://cn.apihz.cn/api/time/getapi.php?id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key) + '&type=2';
                fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(function(data) {
                    if (data.code === 200 && data.msg) {
                        var parts = data.msg.match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                        if (parts) {
                            var apiDate = new Date(
                                parseInt(parts[1], 10),
                                parseInt(parts[2], 10) - 1,
                                parseInt(parts[3], 10),
                                parseInt(parts[4], 10),
                                parseInt(parts[5], 10),
                                parseInt(parts[6], 10),
                                0
                            );
                            apiBaseTime = apiDate;
                            localStartTime = new Date().getTime();
                        }
                    }
                    updateDisplay();
                })
                .catch(function() {
                    updateDisplay();
                });
            }

            function fetchWeather() {
                var url = 'https://zh.wttr.in/北京?format=%l:+%c+%t+%w&_=' + Date.now();
                fetch(url, { headers: { 'Accept': 'text/plain' } })
                .then(function(response) {
                    if (!response.ok) throw new Error();
                    return response.text();
                })
                .then(function(text) {
                    weatherData = text.trim() || 'NULL';
                    updateDisplay();
                })
                .catch(function() {
                    weatherData = 'NULL';
                    updateDisplay();
                });
            }

            fetchApiTime();
            fetchWeather();

            setInterval(updateDisplay, 20);

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    fetchApiTime();
                }
            });
        })();
    </script>
</body>
</html>
